<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRAFTKIT Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      body { padding-bottom: 4rem; }
      .dashboard-shell { max-width: 1100px; margin: 4rem auto 0; padding: 0 1rem; }
      .dashboard-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 1.5rem; }
      .dashboard-panel {
        background: rgba(18, 28, 47, 0.76);
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: var(--shadow);
        padding: 1.5rem;
      }
      .dashboard-panel h2, .dashboard-panel h3 { margin-top: 0; }
      .dashboard-list, .progress-list { list-style: none; padding: 0; margin: 1rem 0 0; display: grid; gap: 0.8rem; }
      .dashboard-list li, .progress-list li {
        padding: 0.9rem 1rem; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,0.02);
      }
      .dashboard-actions { display: flex; gap: 0.8rem; margin-top: 1rem; flex-wrap: wrap; }
      .dashboard-login, .register-form { display: grid; gap: 1rem; }
      .dashboard-login input, .register-form input {
        width: 100%; padding: 0.9rem 1rem; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,0.03); color: var(--text);
      }
      .progress-bar { height: 10px; background: rgba(255,255,255,0.06); border-radius: 999px; overflow: hidden; margin-top: 0.5rem; }
      .progress-bar > span { display: block; height: 100%; background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: inherit; }
      @media (max-width: 760px) { .dashboard-grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="index.html" aria-label="CRAFTKIT home">
          <span class="brand-mark">C</span>
          <span>CRAFTKIT</span>
        </a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html#shop">Shop</a>
          <a href="index.html#courses">Courses</a>
          <a href="dashboard.html">Dashboard</a>
        </nav>
        <div class="nav-actions">
          <a class="btn btn-primary" href="index.html">Back to store</a>
        </div>
      </div>
    </header>

    <main class="dashboard-shell">
      <div class="dashboard-grid">
        <section class="dashboard-panel">
          <p class="eyebrow">Student dashboard</p>
          <h2>Welcome back</h2>
          <div id="dashboardSummary" class="success-box">Loading your account…</div>
          <ul id="dashboardList" class="dashboard-list"></ul>
          <h3 style="margin-top: 1.5rem;">Course progress</h3>
          <ul id="progressList" class="progress-list"></ul>
        </section>

        <aside class="dashboard-panel">
          <p class="eyebrow">Account</p>
          <h3>Login</h3>
          <form id="dashboardLogin" class="dashboard-login">
            <input type="email" id="loginEmail" placeholder="student@example.com" required />
            <input type="password" id="loginPassword" placeholder="Password" required />
            <button type="submit" class="btn btn-primary">Access dashboard</button>
          </form>

          <h3 style="margin-top: 1.5rem;">Create account</h3>
          <form id="registerForm" class="register-form">
            <input type="text" id="registerName" placeholder="Your name" required />
            <input type="email" id="registerEmail" placeholder="you@example.com" required />
            <input type="password" id="registerPassword" placeholder="Password" required />
            <button type="submit" class="btn btn-secondary">Register</button>
          </form>

          <div class="dashboard-actions">
            <a class="btn btn-secondary" href="index.html#courses">Browse courses</a>
            <a class="btn btn-ghost" href="index.html#shop">Shop templates</a>
          </div>
        </aside>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
    <script>
      const dashboardLogin = document.getElementById("dashboardLogin");
      const registerForm = document.getElementById("registerForm");
      const dashboardSummary = document.getElementById("dashboardSummary");
      const dashboardList = document.getElementById("dashboardList");
      const progressList = document.getElementById("progressList");

      async function renderDashboard() {
        const client = supabaseClient;
        if (!client) {
          dashboardSummary.textContent = "Add your Supabase URL and publishable key to supabase-config.js to use your account.";
          return;
        }

        const { data: { user }, error: userError } = await client.auth.getUser();
        if (userError || !user) {
          dashboardSummary.textContent = "No active student session yet. Log in to view your courses and downloads.";
          dashboardList.innerHTML = "";
          progressList.innerHTML = "";
          return;
        }

        const [profileResult, ordersResult, progressResult] = await Promise.all([
          client.from("profiles").select("name,email").eq("id", user.id).maybeSingle(),
          client.from("orders").select("id,items,total,payment_method,status,created_at").eq("user_id", user.id).order("created_at", { ascending: false }),
          client.from("course_progress").select("course_title,progress_value").eq("user_id", user.id).order("updated_at", { ascending: false })
        ]);
        const queryError = profileResult.error || ordersResult.error || progressResult.error;
        if (queryError) {
          dashboardSummary.textContent = `Could not load your Supabase data: ${queryError.message}`;
          return;
        }

        const profile = profileResult.data;
        const orders = ordersResult.data || [];
        const progress = progressResult.data || [];

        dashboardSummary.innerHTML = `
          <strong>${profile?.email || user.email}</strong><br />
          ${profile?.name ? `Name: <strong>${profile.name}</strong><br />` : ""}
          Purchases: <strong>${orders.length}</strong>
        `;

        if (!orders.length) {
          dashboardList.innerHTML = '<li><strong>No purchases yet.</strong><br />Visit the store to buy templates.</li>';
        } else {
          dashboardList.innerHTML = orders.slice(0, 4).map((order) => `
            <li>
              <strong>${order.items.map((item) => item.title || item.name || "Item").join(", ")}</strong><br />
              $${order.total || 0} • ${order.status || "demo"} order
            </li>
          `).join("");
        }

        if (!progress.length) {
          progressList.innerHTML = '<li>No course progress yet. Enroll in a course to begin tracking.</li>';
          return;
        }

        progressList.innerHTML = progress.map((item) => `
          <li>
            <strong>${item.course_title}</strong>
            <div class="progress-bar"><span style="width: ${Math.min(item.progress_value, 100)}%"></span></div>
            <small>${item.progress_value}% complete</small>
            <div style="margin-top: 0.7rem;">
              <button type="button" class="btn btn-secondary" data-course="${item.course_title}" data-progress="${Math.min(100, Number(item.progress_value) + 25)}">Advance lesson</button>
            </div>
          </li>
        `).join("");

        progressList.querySelectorAll("[data-course]").forEach((button) => {
          button.addEventListener("click", async () => {
            const { error } = await client.from("course_progress").upsert({
              user_id: user.id,
              course_title: button.dataset.course,
              progress_value: Number(button.dataset.progress),
              updated_at: new Date().toISOString()
            }, { onConflict: "user_id,course_title" });
            if (error) dashboardSummary.textContent = `Could not save progress: ${error.message}`;
            else renderDashboard();
          });
        });
      }

      dashboardLogin.addEventListener("submit", async (event) => {
        event.preventDefault();
        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value.trim();

        try {
          const user = await loginCraftkitAccount(email, password);
          localStorage.setItem("craftkitUserEmail", user.email);
          await renderDashboard();
          dashboardLogin.reset();
        } catch (error) {
          dashboardSummary.textContent = error.message;
        }
      });

      registerForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const name = document.getElementById("registerName").value.trim();
        const email = document.getElementById("registerEmail").value.trim();
        const password = document.getElementById("registerPassword").value.trim();

        try {
          const user = await registerCraftkitAccount(name, email, password);
          localStorage.setItem("craftkitUserEmail", user.email);
          await renderDashboard();
          registerForm.reset();
        } catch (error) {
          dashboardSummary.textContent = error.message;
        }
      });

      renderDashboard();
    </script>
    <script>
      const homeButton = document.createElement("a");
      homeButton.href = "index.html";
      homeButton.className = "back-home-fab";
      homeButton.textContent = "← Home";
      document.body.appendChild(homeButton);
    </script>
  </body>
</html>
